name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_ACCESS_TOKEN }}
      SLACK_BOT_AUTH_TOKEN: ${{ secrets.SLACK_BOT_AUTH_TOKEN }}
      SLACK_TEAM_ID: ${{ secrets.SLACK_TEAM_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || pip install fastapi uvicorn langchain langchain-groq langchain-openrouter langchain-mcp-adapters mem0ai qdrant-client python-dotenv pydantic pytest pytest-asyncio httpx 2>&1 | tail -5

      - name: Run all tests
        run: |
          python -m pytest tests/ -v --tb=short

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t forgeops:latest .

      - name: Verify image
        run: |
          docker images forgeops:latest

  docker-compose:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest
    needs: [docker-build]
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_ACCESS_TOKEN }}
      SLACK_BOT_AUTH_TOKEN: ${{ secrets.SLACK_BOT_AUTH_TOKEN }}
      SLACK_TEAM_ID: ${{ secrets.SLACK_TEAM_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start services with Docker Compose
        run: |
          docker compose up -d

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "API is ready!"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          echo "API did not become ready in time"
          docker compose logs
          exit 1

      - name: Test API health endpoint
        run: |
          curl -s http://localhost:8000/health | python -m json.tool

      - name: Test query endpoint
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8000/query \
            -H "Content-Type: application/json" \
            -d '{"user_query":"Why did GitHub Actions workflow run 37852919557 fail in AllenGeorge08/LLM-Semantic-Caching-Gateway?", "thread_id":"ci-test-1"}')
          echo "$RESPONSE" | python -m json.tool
          
          # Verify response contains expected fields
          echo "$RESPONSE" | python3 -c "
import sys, json
data = json.load(sys.stdin)
assert data['status'] in ('completed', 'completed_with_errors'), f'Unexpected status: {data[\"status\"]}'
assert 'final_response' in data, 'Missing final_response'
assert 'thread_id' in data, 'Missing thread_id'
assert 'guardrail' in data, 'Missing guardrail'
print('API response validation PASSED')
"

      - name: Stop services
        if: always()
        run: |
          docker compose down

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: |
          pip install flake8 black

      - name: Run flake8
        run: |
          python -m flake8 app/ tests/ --max-line-length=120 --ignore=E203,W503 || true

      - name: Check formatting with black
        run: |
          python -m black --check app/ tests/ || true